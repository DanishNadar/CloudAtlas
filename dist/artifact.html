<title>Cloud Atlas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230b1426%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2221%22%20fill%3D%22none%22%20stroke%3D%22%232fd3e6%22%20stroke-width%3D%225%22%2F%3E%0A%20%20%3Cellipse%20cx%3D%2232%22%20cy%3D%2232%22%20rx%3D%228.5%22%20ry%3D%2221%22%20fill%3D%22none%22%20stroke%3D%22%233d8bff%22%20stroke-width%3D%224%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M11%2032h42%22%20stroke%3D%22%233d8bff%22%20stroke-width%3D%224%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2248%22%20cy%3D%2216%22%20r%3D%225.5%22%20fill%3D%22%23f5b13d%22%20stroke%3D%22%230b1426%22%20stroke-width%3D%223%22%2F%3E%0A%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a chapter is one screen — driving question on top, a dominant instrument (diagram or simulator) with a narrow explanation rail; dark "infrastructure" surfaces, off-white "explanation" surfaces. Single deliberate theme. */
:root {
  --bg: #070d1a;
  --bg2: #0b1426;
  --panel: #101c33;
  --panel2: #132442;
  --line: #22385c;
  --grid: #142542;
  --fg: #e8eef8;
  --muted: #9fb0cc;
  --dim: #647aa0;
  --blue: #3d8bff;
  --cyan: #2fd3e6;
  --green: #3ccf8e;
  --amber: #f5b13d;
  --red: #ff5c66;
  --violet: #a78bfa;
  --f-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  color-scheme: dark;
}
.paper {
  --bg: #f3f5f9; --bg2: #fbfcfe; --panel: #ffffff; --panel2: #f0f3f8; --line: #cfd8e6; --grid: #e3e9f2;
  --fg: #0d1729; --muted: #4a5d7e; --dim: #8496b3;
  --blue: #1f66d6; --cyan: #0b8ea0; --green: #0e8a57; --amber: #a86400; --red: #cc2f3b; --violet: #6d4fd1;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.c-blue { color: var(--blue); } .c-cyan { color: var(--cyan); } .c-green { color: var(--green); } .c-amber { color: var(--amber); } .c-red { color: var(--red); } .c-violet { color: var(--violet); } .c-muted { color: var(--muted); } .c-dim { color: var(--dim); }

/* chrome */
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #050a14; border-bottom: 1px solid var(--line); min-width: 0; }
.bar.foot { border-top: 1px solid var(--line); border-bottom: 0; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 14px/1 var(--f-display); letter-spacing: .16em; white-space: nowrap; }
.mark { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--cyan); position: relative; }
.mark::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--blue); border-left-color: transparent; border-right-color: transparent; }
.secnav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.secnav button { background: none; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; color: var(--muted); font: 500 13.5px var(--f-body); white-space: nowrap; }
.secnav button:hover { color: var(--fg); background: var(--panel); }
.secnav button[aria-current="true"] { color: var(--fg); background: var(--panel2); box-shadow: inset 0 -2px 0 var(--cyan); }
.bar-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.crumbbar { display: flex; justify-content: space-between; gap: 12px; padding: 5px 16px; font-size: 12.5px; color: var(--dim); border-bottom: 1px solid var(--grid); background: #060c18; }
.crumbbar #crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#progTxt { white-space: nowrap; }
.prog { flex: 1; height: 5px; background: var(--grid); border-radius: 3px; position: relative; overflow: hidden; }
#progFill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--blue), var(--cyan)); width: 0; transition: width .3s; }
#count { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.btn { font: 600 12.5px/1 var(--f-body); letter-spacing: .02em; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--blue); }
.btn.primary { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 18%, var(--panel)); }
.btn.warn { border-color: color-mix(in srgb, var(--red) 70%, var(--line)); color: var(--red); }
.btn.good { border-color: var(--green); color: var(--green); }
.btn[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg .btn { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg .btn:last-child { border-right: 0; }

/* stage & slides */
#stage { position: relative; overflow: auto; min-height: 0; }
.slide { min-height: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: clamp(14px, 2vw, 26px); padding-inline: clamp(16px, 3vw, 44px); background: var(--bg); color: var(--fg); }
.slide:not(.paper) { background: radial-gradient(1100px 520px at 90% -15%, color-mix(in srgb, var(--blue) 9%, transparent), transparent 60%), var(--bg); }
.slide.ai:not(.paper) { background: radial-gradient(1100px 520px at 90% -15%, color-mix(in srgb, var(--violet) 12%, transparent), transparent 60%), var(--bg); }
@media (prefers-reduced-motion: no-preference) { .slide { animation: slidein .35s ease-out both; } @keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
.sh { display: flex; flex-direction: column; gap: 4px; }
.kicker { font: 600 11.5px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.ai .kicker { color: var(--violet); }
.sh h2 { margin: 0; font: 600 clamp(24px, 2.6vw, 38px)/1.12 var(--f-display); letter-spacing: -.01em; text-wrap: balance; max-width: 40ch; }
details.obj { font-size: 14px; color: var(--muted); }
details.obj summary { cursor: pointer; width: max-content; font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
details.obj ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 2px; }
.sb { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.sf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notice { display: flex; gap: 12px; align-items: baseline; padding: 9px 14px; border-left: 3px solid var(--cyan); background: color-mix(in srgb, var(--cyan) 7%, transparent); font-size: 14.5px; }
.notice > span { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; }
.notice.myth { border-left-color: var(--amber); background: color-mix(in srgb, var(--amber) 7%, transparent); }
.notice.myth > span { color: var(--amber); }

.split { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr); gap: clamp(16px, 2vw, 26px); flex: 1; min-height: 0; }
.split.even { grid-template-columns: 1fr 1fr; }
.split.rev { grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr); }
.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rail p { margin: 0; max-width: 62ch; color: var(--muted); }
.rail p b, .rail p strong { color: var(--fg); font-weight: 600; }
.lede { font-size: clamp(17px, 1.35vw, 20px); color: var(--fg) !important; line-height: 1.45; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.viz { position: relative; flex: 1; min-height: 340px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); overflow: hidden; }
.viz.grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; }
.viz.auto { flex: 0 0 auto; min-height: 0; }
.cvhost { position: absolute; inset: 0; }
.cvhost canvas { display: block; }
.vtag { position: absolute; top: 8px; left: 12px; font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.controls.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.controls.stack .ctl { justify-content: space-between; }
.controls.stack .ctl.chk { justify-content: flex-start; }
.ctl input[type=range] { width: clamp(100px, 10vw, 160px); accent-color: var(--blue); }
.ctl output { min-width: 6.5ch; color: var(--fg); font-size: 13px; text-align: right; }
.ctl.chk input { accent-color: var(--blue); width: 17px; height: 17px; }
.sel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 14px; }
.stepn { font-size: 12.5px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 13px 15px; min-width: 0; }
.card h3 { margin: 0 0 6px; font: 600 16px/1.25 var(--f-display); }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.card p + p { margin-top: 6px; }
.pill { display: inline-block; font: 600 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; border: 1px solid currentColor; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 9px 12px; min-width: 0; }
.tile .tl { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.tile .tv { font-size: clamp(16px, 1.35vw, 21px); margin-top: 2px; overflow-wrap: anywhere; }
.tile .ts { font-size: 12.5px; color: var(--muted); }
.tile.good .tv { color: var(--green); } .tile.warn .tv { color: var(--amber); } .tile.bad .tv { color: var(--red); } .tile.ai .tv { color: var(--violet); }
.explain { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 15px; font-size: 15px; }
.explain h4 { margin: 0 0 4px; font: 600 15px var(--f-display); }
.explain p { margin: 0; color: var(--muted); }
.explain p + p { margin-top: 6px; }
.eng-only { display: none !important; }
body.eng .eng-only { display: revert !important; }
body.eng .exp-only { display: none !important; }
.engbox { border: 1px dashed color-mix(in srgb, var(--violet) 60%, var(--line)); background: color-mix(in srgb, var(--violet) 6%, transparent); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; }
.engbox > b:first-child, .engtag { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--violet); display: block; margin-bottom: 4px; }
.engbox p { margin: 0; color: var(--muted); } .engbox p + p { margin-top: 6px; }
.engbox code, code.k { font: 13px var(--f-mono); color: var(--cyan); }
pre.code { margin: 0; font: 12.5px/1.55 var(--f-mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 320px; }
.list { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; font-size: 14.5px; }
.list b { color: var(--fg); }
.trace { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.trace li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.trace .ic { font: 700 14px var(--f-mono); }
.trace .ok .ic { color: var(--green); } .trace .no .ic { color: var(--red); }
.trace b { color: var(--fg); font-weight: 600; }
.trace span.w { color: var(--muted); }
.verdict { font: 600 15px var(--f-display); padding: 8px 12px; border-radius: 8px; border: 1px solid; }
.verdict.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 60%, var(--line)); background: color-mix(in srgb, var(--green) 8%, transparent); }
.verdict.no { color: var(--red); border-color: color-mix(in srgb, var(--red) 60%, var(--line)); background: color-mix(in srgb, var(--red) 8%, transparent); }
.verdict.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); background: color-mix(in srgb, var(--amber) 8%, transparent); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.tscroll { overflow-x: auto; min-width: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs .btn { border: 0; border-radius: 6px 6px 0 0; background: none; color: var(--muted); padding: 9px 12px; }
.tabs .btn[aria-selected="true"] { color: var(--fg); background: var(--panel); box-shadow: inset 0 -2px 0 var(--cyan); }
.log { font: 12.5px/1.55 var(--f-mono); color: var(--muted); max-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.log div b { color: var(--fg); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: var(--panel); cursor: pointer; color: var(--fg); }
.chip[aria-pressed="true"] { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 16%, var(--panel)); }
.chip.ai[aria-pressed="true"] { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 18%, var(--panel)); }

/* SVG flow primitives */
svg.flow { width: 100%; height: 100%; display: block; }
svg.flow .fb { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
svg.flow .fb.vpc { stroke: var(--blue); fill: color-mix(in srgb, var(--blue) 4%, transparent); }
svg.flow .fb.pub { stroke: var(--green); stroke-dasharray: none; fill: color-mix(in srgb, var(--green) 4%, transparent); }
svg.flow .fb.priv { stroke: var(--cyan); stroke-dasharray: none; fill: color-mix(in srgb, var(--cyan) 4%, transparent); }
svg.flow .fb.az { stroke: var(--dim); }
svg.flow .fb.down { stroke: var(--red); fill: color-mix(in srgb, var(--red) 8%, transparent); }
svg.flow .fb.ai { stroke: var(--violet); fill: color-mix(in srgb, var(--violet) 5%, transparent); }
svg.flow .fbl { font: 600 12px var(--f-mono); fill: var(--muted); letter-spacing: .06em; }
svg.flow .fbs { font: 500 11px var(--f-mono); fill: var(--dim); }
svg.flow .fbl.vpc { fill: var(--blue); } svg.flow .fbl.pub { fill: var(--green); } svg.flow .fbl.priv { fill: var(--cyan); } svg.flow .fbl.down { fill: var(--red); } svg.flow .fbl.ai { fill: var(--violet); }
svg.flow .fe { stroke: var(--line); stroke-width: 2; }
svg.flow .fe.on { stroke: var(--cyan); stroke-width: 2.5; }
svg.flow .fe.bad { stroke: var(--red); stroke-dasharray: 5 4; }
svg.flow .fe.dash { stroke-dasharray: 4 5; }
svg.flow .fn rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
svg.flow .fn .fnt { font: 600 14.5px var(--f-display); fill: var(--fg); text-anchor: middle; }
svg.flow .fn .fns { font: 500 11.5px var(--f-mono); fill: var(--muted); text-anchor: middle; }
svg.flow .fn .fni { font: 600 10px var(--f-mono); fill: var(--dim); }
svg.flow .fn.client rect { stroke: var(--blue); }
svg.flow .fn.on rect { stroke: var(--cyan); stroke-width: 2.5; fill: color-mix(in srgb, var(--cyan) 14%, var(--panel)); }
svg.flow .fn.done rect { stroke: color-mix(in srgb, var(--cyan) 55%, var(--line)); }
svg.flow .fn.bad rect { stroke: var(--red); stroke-width: 2.5; fill: color-mix(in srgb, var(--red) 12%, var(--panel)); }
svg.flow .fn.warn rect { stroke: var(--amber); stroke-width: 2.5; fill: color-mix(in srgb, var(--amber) 12%, var(--panel)); }
svg.flow .fn.good rect { stroke: var(--green); stroke-width: 2.5; fill: color-mix(in srgb, var(--green) 12%, var(--panel)); }
svg.flow .fn.ai rect { stroke: color-mix(in srgb, var(--violet) 60%, var(--line)); }
svg.flow .fn.ai.on rect { stroke: var(--violet); fill: color-mix(in srgb, var(--violet) 18%, var(--panel)); }
svg.flow .fn.off { opacity: .28; }
svg.flow .fn.sel rect { stroke: var(--fg); stroke-width: 2.5; }
svg.flow .pk { fill: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
svg.flow .pk.ret { fill: var(--green); filter: drop-shadow(0 0 6px var(--green)); }
svg.flow .pk.bad { fill: var(--red); filter: drop-shadow(0 0 6px var(--red)); }
svg.flow .pk.ai { fill: var(--violet); filter: drop-shadow(0 0 6px var(--violet)); }
svg.flow text.lbl { font: 500 12px var(--f-mono); fill: var(--muted); }

/* hero */
.hero-title { font: 700 clamp(34px, 3.6vw, 56px)/1.04 var(--f-display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.hero-title em { font-style: normal; color: var(--cyan); }
.hero-sub { font-size: clamp(17px, 1.4vw, 21px); color: var(--muted); max-width: 52ch; margin: 0; }
.urlbar { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font: 500 15px var(--f-mono); max-width: 420px; }
.urlbar .lock { color: var(--green); }
.caret { display: inline-block; width: 1px; height: 1em; background: var(--fg); vertical-align: -2px; }

/* overlays */
#notes { position: fixed; right: 0; top: 0; bottom: 0; width: min(470px, 100%); z-index: 20; background: #040913; border-left: 1px solid var(--line); overflow: auto; padding-block: 18px; padding-inline: 20px; box-shadow: -20px 0 40px rgba(0,0,0,.45); }
#notes h3 { font: 600 19px/1.25 var(--f-display); margin: 4px 0 12px; }
#notes .nl { font: 600 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin: 14px 0 4px; }
#notes p { margin: 0 0 8px; font-size: 15.5px; }
#notes .q { color: var(--amber); } #notes .mis { color: var(--red); } #notes .meta { font: 12px var(--f-mono); color: var(--muted); }
#grid { position: fixed; inset: 0; z-index: 30; background: rgba(3,7,15,.97); overflow: auto; padding-block: 22px; padding-inline: clamp(16px, 4vw, 48px); }
#grid .gh { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
#grid h3 { margin: 0; font: 600 24px var(--f-display); }
#grid ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
#grid li button { width: 100%; height: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
#grid li button:hover, #grid li.cur button { border-color: var(--cyan); }
#grid .gk { font: 600 10.5px var(--f-mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
#grid .gt { font: 600 15px/1.3 var(--f-display); }
#grid .gl { font-size: 13px; color: var(--muted); }
#grid .gs { font: 11.5px var(--f-mono); margin-top: auto; }
#grid .help { color: var(--muted); font: 12.5px var(--f-mono); margin-top: 18px; }

/* presentation mode: distraction-free, larger type */

/* presenter window */

body.presenter #notes { position: static; width: auto; box-shadow: none; border: 0; }

@media (max-width: 1100px) { .secnav { display: none; } .hide-sm { display: none; } }
@media (max-width: 860px) {

  .bar { flex-wrap: wrap; }
  .bar-r { justify-content: flex-start; }
}

    spikeWeek: 40,         // a launch / marketing spike
    spikeMult: 2.2,        // demand multiplier during the spike
    spikeWeeks: 3,
    usersPerServer: 2000,  // capacity of one server
    onpremServers: 14,     // initial purchase
    leadWeeks: 10,         // time from purchase order to racked server
    buyAt: 0.8,            // order more when projected utilization exceeds this
    capex: 6000,           // $ per on-prem server (hardware), paid at order time
    lifeYears: 5,          // hardware depreciation period used for the amortized comparison
    opexWeek: 30,          // $ per on-prem server-week (power, space, maintenance share)
    cloudWeek: 90,         // $ per cloud server-week (on-demand style)
    cloudTarget: 0.7       // autoscaling target utilization
  };

  id: 'journey', section: 'explore', ch: 0, kicker: 'Prologue', title: 'What actually happens when you open a website?', short: 'A request\'s journey', bare: true, lab: 'Step through DNS, TLS, CDN, load balancer, servers and databases.',

    const edges = [['browser', 'resolver'], ['resolver', 'auth'], ['browser', 'edge'], ['edge', 'lb'], ['edge', 's3', 'dash'], ['lb', 'app1'], ['lb', 'app2'], ['app1', 'db'], ['app1', 's3'], ['app2', 'db'], ['lb', 'app3'], ['lb', 'app4']];
    const boundaries = [

      ['app3', 'app4', 'mon', 'asg'].forEach(id => F.show(id, zoom));

    function explain(id) { const [t, d] = JOURNEY_INFO[id] || [id, '']; comp.hidden = false; comp.innerHTML = `<h4>${t}</h4><p>${d}</p>`; F && Object.keys(F.N).forEach(k => F.N[k].g.classList.toggle('sel', k === id)); }
    const O = { type: 'page', cache: 'hit' };

    const cacheSeg = U.seg(opts, [['hit', 'Cache hit'], ['miss', 'Cache miss']], O.cache, v => { O.cache = v; restart(); }, 'CDN cache');
    const urlEl = el.querySelector('#url');
    const steps = () => {

      const s = [
        { t: 'You type a name', n: ['browser'], h: [], url: 'pixelpost.app' + path,
          e: 'Your browser knows a name, not a location. Computers route traffic to numeric IP addresses, so the name must be translated first.',
          g: 'The browser checks its own DNS cache and the operating system\'s resolver cache before asking the network.' },
        { t: 'DNS: name → address', n: ['resolver', 'auth'], h: [['browser', 'resolver'], ['resolver', 'auth']],
          e: 'We need a way to convert a memorable domain name into a network destination. That\'s where DNS enters the picture.',
          g: 'A recursive resolver walks root → .app TLD → the authoritative name servers (Route 53). Each answer is cached for its TTL, so most lookups never leave the resolver.' },
        { t: 'The answer comes back', n: ['browser'], h: [['auth', 'resolver', 'ret'], ['resolver', 'browser', 'ret']],
          e: 'DNS returns the address of a CDN edge location near you, not of a single faraway server.',
          g: 'CloudFront distributions are reached through DNS records (an alias in Route 53) that resolve to edge addresses chosen to be close to the resolver.' },
        { t: 'Open a secure connection', n: ['browser', 'edge'], h: [['browser', 'edge'], ['edge', 'browser', 'ret']],
          e: 'Before sending anything private, the browser and the edge agree on encryption and the edge proves it really is pixelpost.app.',
          g: 'TCP handshake (1 round trip) + TLS 1.3 handshake (1 round trip). HTTP/3 runs over QUIC, which combines them. The TLS certificate must match the domain.' },
        { t: 'Send the request', n: ['edge'], h: [['browser', 'edge']],
          e: `The browser sends <code class="k">GET ${path}</code>. The edge decides whether it can answer by itself.`,

      ];
      if (O.type === 'page' && O.cache === 'hit') {

      } else if (O.type === 'page') {
        s.push({ t: 'Cache miss → origin', n: ['edge', 's3'], h: [['edge', 's3'], ['s3', 'edge', 'ret']], e: 'The edge doesn\'t have this file yet, so it fetches it from the origin: the S3 bucket holding Pixelpost\'s photos.',
          g: 'With origin access control, only CloudFront may read the bucket; the bucket itself stays private.' });
        s.push({ t: 'Cache and deliver', n: ['edge'], h: [['edge', 'browser', 'ret']], e: 'The edge stores a copy for the next visitor nearby and returns the image to you.', g: 'Subsequent requests in that region become cache hits until the object expires or is invalidated.' });
      } else {
        s.push({ t: 'Forward to the Region', n: ['edge', 'lb'], h: [['edge', 'lb']], e: 'Your feed is personal, so the edge forwards the request to the application\'s origin: a load balancer in an AWS Region.',
          g: 'CloudFront → ALB over the AWS network; the ALB terminates TLS again (or the edge re-encrypts to the origin).' });
        s.push({ t: 'Pick a healthy server', n: ['lb', 'app1'], h: [['lb', 'app1']], e: 'One server is not enough for many users, and it can fail. The load balancer sends this request to a healthy copy of the app.',
          g: 'Health checks probe each target; the ALB routes by listener rules and spreads requests (round robin or least outstanding requests).' });
        s.push({ t: 'Read data', n: ['app1', 'db'], h: [['app1', 'db'], ['db', 'app1', 'ret']], e: 'The app asks the database for the latest posts from people you follow. The photos themselves stay in object storage.',
          g: 'A typical query uses an index on (follower_id, created_at). Photo URLs point to CloudFront, so image bytes never pass through the app server.' });
        s.push({ t: 'Respond', n: ['browser'], h: [['app1', 'lb', 'ret'], ['lb', 'edge', 'ret'], ['edge', 'browser', 'ret']], e: 'The response travels back the same way: server → load balancer → edge → you.', g: 'JSON response, compressed (gzip/brotli). Total time ≈ DNS + handshakes + edge↔origin + server time.' });
      }
      s.push({ t: 'The page renders', n: ['browser'], h: [], e: 'Your browser draws the page and fires more requests for scripts, fonts and images. Each one repeats part of this journey, though DNS and connections are reused.',
        g: 'Browsers reuse connections (HTTP/2 multiplexing). Real pages make dozens of requests; the CDN absorbs most of them.' });
      s.push({ t: 'Zoom out', n: ['lb', 'app1', 'app2', 'app3', 'app4', 'mon', 'asg'], h: [], zoom: true, e: 'Everything you just saw is a slice of a larger architecture: servers in two Availability Zones, automatic scaling, monitoring. Now let\'s understand how engineers build and operate it.',
        g: 'Chapters 3–10 open each box: Regions and AZs, networking, scaling, storage, security, deployment and monitoring.' });
      return s;
    };
    let zoomed = false; let typing = null;
    const typeUrl = (txt, anim) => {
      clearInterval(typing); if (!anim) { urlEl.textContent = txt; return; }
      let k = 0; urlEl.textContent = ''; typing = setInterval(() => { urlEl.textContent = txt.slice(0, ++k); if (k >= txt.length) clearInterval(typing); }, 35);
    };
    const exp = el.querySelector('#exp'), engx = el.querySelector('#engx');
    const render = async (i, anim) => {
      const S = steps(); const s = S[i];

      s.n.forEach(id => F.state(id, 'on'));

  notes: {
    objective: 'Give learners one concrete mental model of a request that later chapters zoom into.',
    say: ['Every chapter tonight opens one of these boxes. Watch where the request goes and ask: why does this component exist?', 'DNS turns a name into an address. The CDN answers what it can from nearby. Everything else goes to a Region, where a load balancer picks a healthy server.', 'Switch between a cached image and a personalized API call: they take very different paths.'],
    demo: ['Play the "Page & images · Cache hit" path first, then switch to Cache miss, then API data.', 'Click any box to explain it. Press E to show engineering details.'],
    ask: 'Why does a cache hit make the website faster and cheaper at the same time?',
    answer: 'The response comes from nearby (fewer milliseconds) and the origin does no work (fewer servers, less data transfer).',
    transition: 'Now let\'s understand how engineers build and operate everything you just saw — starting with why anyone rents servers at all.'
  },
  check: { q: 'A visitor requests an image that the CDN edge already has cached. Which components handle the request?', opts: ['Browser, DNS resolver, CDN edge', 'Browser, CDN edge, load balancer, app server', 'Browser, load balancer, S3', 'Every component in the diagram'], a: 0, why: 'DNS finds the edge; the edge answers from cache. The Region\'s servers never see a cache hit.' },
  myth: 'Requests don\'t follow one fixed path. Cached files, uncached files and API calls each take a different route.'
});

scene({
  id: 'why-cloud', section: 'explore', ch: 1, kicker: 'Why the cloud exists', title: 'What problem did cloud computing solve?', short: 'Build your own data center', lab: 'On-premises vs. cloud capacity under growth and spikes.',
  objectives: ['Compare fixed, owned capacity with elastic, rented capacity', 'See over- and under-provisioning on real curves', 'Read the cost trade-off without assuming cloud is always cheaper'],
  html: `
  <div class="split" style="grid-template-columns:minmax(280px,0.85fr) minmax(0,2.1fr)">
    <div class="rail">
      <p class="lede">Pixelpost is growing. Do you <b>buy servers</b> and wait for delivery, or <b>rent capacity</b> by the hour?</p>
      <div class="controls stack" id="ctl"></div>
      <div class="tiles" id="tiles"></div>
      <div class="explain" id="story" aria-live="polite"></div>
      <div class="engbox eng-only"><b>Model</b><p>Demand(w) = base × (1+g)<sup>w/52</sup> × (1 + s·sin 2πw/52) × spike. On-prem orders servers when the lead-time forecast (trend only) exceeds 80% utilization, sized to 60%. Cloud runs ⌈demand ÷ (capacity × 70%)⌉ servers each week. On-prem cost = hardware amortized over 5 years + weekly operations; cash = hardware paid when ordered.</p><p>Not modeled: staff costs, licenses, data transfer, discounts, the hours-scale delay of scaling out, account quotas.</p></div>
    </div>
    <div class="col">
      <div class="viz" style="min-height:250px"><div class="cvhost" id="c1"></div></div>
      <div class="viz" style="min-height:180px;flex:0.7"><div class="cvhost" id="c2"></div></div>
    </div>
  </div>`,
  notice: 'Owned capacity is flat between purchases: idle in quiet weeks, short during the spike. Rented capacity follows demand.',
  myth: 'Cloud is not automatically cheaper. With steady, predictable demand, owned hardware can cost less; elasticity is what you pay extra for.',
  mount(el, slide) {
    const k = U.tok(slide); const P = Object.assign({}, SIM.capacityDefaults);
    let R;
    const c1 = U.canvas(el.querySelector('#c1'), draw), c2 = U.canvas(el.querySelector('#c2'), draw2);
    function run() { R = SIM.capacity(P); c1.draw(); c2.draw(); summary(); }
    function draw() {
      if (!R) return; const ymax = Math.max(...R.demand, ...R.onCap, ...R.cloudCap) * 1.05;
      U.chart(c1, { k, x: [0, P.weeks], y: [0, ymax], xTicks: 6, xFmt: v => 'wk ' + Math.round(v), yFmt: v => U.fmt(v / 1000) + 'k', yLabel: 'users served per week', legend: true,
        bands: [{ from: P.spikeWeek, to: P.spikeWeek + P.spikeWeeks, color: U.a(k.amber, 0.12) }],
        series: [{ data: R.onCap, color: k.blue, label: 'On-prem capacity', step: true, width: 2.5 }, { data: R.cloudCap, color: k.cyan, label: 'Cloud capacity', width: 1.5, dash: [4, 3] }, { data: R.demand, color: k.fg, label: 'Demand', width: 2 }] });
    }
    function draw2() {
      if (!R) return; const ymax = Math.max(R.onCost.at(-1), R.cloudCost.at(-1)) * 1.08;
      U.chart(c2, { k, x: [0, P.weeks], y: [0, ymax], xTicks: 6, xFmt: v => 'wk ' + Math.round(v), yFmt: v => '$' + U.fmt(v / 1000) + 'k', yLabel: 'cumulative cost (illustrative)', legend: true,
        series: [{ data: R.onCost, color: k.blue, label: 'On-prem (amortized)' }, { data: R.cloudCost, color: k.cyan, label: 'Cloud' }] });
    }
    function summary() {
      const s = R.summary;
      U.tiles(el.querySelector('#tiles'), [
        ['Demand missed', `${U.fmt(s.onUnservedPct, 1)}% · ${U.fmt(s.cloudUnservedPct, 1)}%`, s.onUnservedPct > 0.05 ? 'warn' : 'good', 'on-prem · cloud'],
        ['Avg utilization', `${U.fmt(s.onUtil * 100)}% · ${U.fmt(s.cloudUtil * 100)}%`, '', 'on-prem · cloud'],
        ['3-year cost', `${U.money(s.onCost / 1000)}k · ${U.money(s.cloudCost / 1000)}k`, '', 'amortized · cloud'],
        ['Cash spent', U.money(s.onCash / 1000) + 'k', '', `on-prem, ${s.purchases.length} purchase orders`]
      ]);
      const cheaper = s.onCost < s.cloudCost ? 'on-prem' : 'cloud';
      el.querySelector('#story').innerHTML = `<h4>What happened</h4><p>${s.onUnservedPct > 0.05 ? `During the week-${P.spikeWeek} spike, on-prem could not serve <b>${U.fmt(s.onUnservedPct, 1)}%</b> of total demand: new servers take ${P.leadWeeks} weeks to arrive and the spike was not in the forecast.` : 'On-prem had enough headroom for every week, including the spike.'} On-prem averaged <b>${U.fmt(s.onUtil * 100)}%</b> utilization; the rest is paid-for idle capacity.</p><p>With these assumptions <b>${cheaper}</b> is cheaper over 3 years${cheaper === 'on-prem' ? ', but it needed ' + U.money(s.onCash / 1000) + 'k in cash up front and still missed peak demand' : ''}. Change growth or the spike and the answer moves.</p>`;
      if (s.onUnservedPct > 0.05) U.markDone('why-cloud');
    }
    const c = el.querySelector('#ctl');
    U.slider(c, { label: 'Demand growth / year', min: 0, max: 150, step: 5, value: P.growthPct, fmt: v => v + '%' }, v => { P.growthPct = v; run(); });
    U.slider(c, { label: 'Launch spike', min: 1, max: 4, step: 0.1, value: P.spikeMult, fmt: v => '×' + v.toFixed(1) }, v => { P.spikeMult = v; run(); });
    U.slider(c, { label: 'Servers bought at start', min: 6, max: 40, step: 1, value: P.onpremServers, fmt: v => v }, v => { P.onpremServers = v; run(); });
    U.slider(c, { label: 'Hardware lead time', min: 1, max: 20, step: 1, value: P.leadWeeks, fmt: v => v + ' wk' }, v => { P.leadWeeks = v; run(); });
    const e1 = U.slider(c, { label: 'Cloud $ / server-week', min: 30, max: 200, step: 5, value: P.cloudWeek, fmt: v => '$' + v }, v => { P.cloudWeek = v; run(); });
    const e2 = U.slider(c, { label: 'On-prem $ / server', min: 2000, max: 15000, step: 500, value: P.capex, fmt: v => '$' + U.fmt(v) }, v => { P.capex = v; run(); });
    [e1, e2].forEach(s => s.el.classList.add('eng-only'));
    run();
    return () => { c1.destroy(); c2.destroy(); };
  },
  notes: {
    objective: 'Learners see over- and under-provisioning and understand elasticity as the core economic idea, with honest cost trade-offs.',
    say: ['Blue is servers you own: you buy in big steps and wait weeks for delivery. White is demand. Cyan is rented capacity that follows demand.', 'Look at the spike: on-prem has no way to react in time. Now look at quiet weeks: on-prem is paying for idle machines.', 'Now set growth to zero and the spike to ×1. On-prem becomes cheaper. Elasticity is what you pay for.'],
    demo: ['Default → growth 0%, spike ×1 → growth 120%, lead time 18 weeks.', 'Engineer mode exposes the price assumptions.'],
    ask: 'When would a company rationally keep its own data center?',
    answer: 'Steady, predictable, high utilization; data-residency or latency constraints; existing sunk investment; specialized hardware. Many run hybrid.',
    transition: 'If you rent, who is responsible for what?'
  },
  check: { q: 'Why did on-prem miss demand during the spike in the simulator?', opts: ['Cloud servers are faster', 'New hardware takes weeks to arrive and the spike wasn\'t forecast', 'On-prem servers can\'t be load balanced', 'Cloud has unlimited capacity'], a: 1, why: 'Capacity you own changes only after a purchase lead time. Elastic capacity changes in minutes — within quotas and limits.' }
});

scene({

  html: `

      <div class="explain" id="lat"></div>
      <div class="engbox eng-only"><b>Latency estimate</b><p>RTT ≈ 2 × distance × 1.5 ÷ 200,000 km/s + 5 ms. Light in fiber travels ~200,000 km/s; 1.5 approximates indirect cable routes. Real latency depends on routing and congestion — measure it.</p><p>Shown Regions are a sample. The current list and each Region's AZs are in the AWS documentation.</p></div>

    const dist = (a, b) => { const R = 6371, r = Math.PI / 180; const dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r; const h = Math.sin(dl / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

        ctx.font = k.monoS; ctx.fillStyle = k.muted; ctx.textAlign = 'left'; ctx.fillText(r[0], x + 7, y - 4); });
      ctx.fillStyle = k.amber; ctx.beginPath(); ctx.arc(T.X(user[1]), T.Y(user[0]), 6, 0, 7); ctx.fill(); ctx.fillStyle = k.amber; ctx.font = k.monoB; ctx.fillText('you', T.X(user[1]) + 8, T.Y(user[0]) + 14);
      el.querySelector('#lat').innerHTML = `<h4>Estimated round-trip time from you</h4><div class="tscroll"><table class="t"><tbody>${lats.slice(0, 5).map(({ r, d }) => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="mono">${U.fmt(d)} km</td><td class="mono ${r[0] === near ? 'c-green' : ''}">~${U.fmt(rtt(d))} ms</td></tr>`).join('')}</tbody></table></div><p style="margin-top:6px">Nearest Region: <b>${lats[0].r[1]}</b>. Proximity lowers latency, but data-residency rules, service availability and price can matter more.</p>`;

      AZ.forEach((a, i) => {

      const dbUp = !down.has('a') || (D.db === 'multi' && !down.has('b'));
      const cap = Math.min(alive, D.need);

scene({
  id: 'surge', section: 'explore', ch: 6, kicker: 'Scaling, load balancing, high availability', title: 'What happens when one thousand users become one million?', short: 'Traffic surge simulator', lab: 'Queues, autoscaling, health checks and AZ failure under load.',
  objectives: ['Relate throughput, capacity, queueing and latency', 'See autoscaling react with a provisioning delay', 'Watch an AZ failure with — and without — enough spare capacity'],
  html: `

    <div class="rail" style="gap:10px">
      <div class="controls" id="run"></div>
      <div class="controls stack" id="ctl"></div>
      <div class="controls" id="inject"></div>
      <div class="engbox eng-only"><b>Model</b><p>Time-stepped fluid queue per instance (0.1 s steps). Instance capacity c req/s; waiting ≈ queue ÷ c; latency = processing time + wait; requests waiting longer than the 2 s timeout are rejected. Health checks take ${SIM.trafficDefaults.hcS} s to remove a failed target; requests routed there meanwhile fail. Autoscaling uses 10 s average utilization, a cooldown and a launch delay.</p><p>Not modeled: network latency, retries, connection limits, request-size variance (an M/M/c model would add random waiting even below capacity).</p></div>
    </div>
    <div class="col">
      <div class="tiles" id="tiles"></div>
      <div class="viz" style="min-height:250px"><div class="cvhost" id="fleet"></div></div>
      <div class="grid2"><div class="viz" style="min-height:160px"><div class="cvhost" id="ch1"></div></div><div class="viz" style="min-height:160px"><div class="cvhost" id="ch2"></div></div></div>
      <div class="explain" id="why" aria-live="polite"></div>
    </div>
  </div>`,
  notice: 'When offered traffic exceeds capacity, queues fill, latency climbs to the timeout, and the excess is rejected. More servers fix it only after they finish launching.',
  myth: 'A load balancer doesn\'t create capacity. It spreads load; if every server (or the database behind them) is saturated, users still wait.',
  mount(el, slide) {
    const k = U.tok(slide);
    const P = Object.assign({}, SIM.trafficDefaults, { azs: 2, perAz: 2, auto: false });
    let T, rps = 300, surgeUntil = -1, speed = 1, running = !U.RM, last = null, dots = [];
    const reset = () => { T = SIM.Traffic(P); dots = []; last = null; azBtn.setAttribute('aria-pressed', 'false'); };
    const offered = () => rps * (T && T.t < surgeUntil ? 4 : 1);
    const fleet = U.canvas(el.querySelector('#fleet'), drawFleet), c1 = U.canvas(el.querySelector('#ch1'), drawCharts), c2 = U.canvas(el.querySelector('#ch2'), drawCharts);
    function drawFleet() {
      if (!T) return; const { ctx, W, H } = fleet; ctx.clearRect(0, 0, W, H);
      const AZ = ['a', 'b', 'c'].slice(0, P.azs); const colW = (W - 40) / AZ.length; const lbX = W / 2, lbY = 34;
      ctx.font = k.sans; const lbT = `Load balancer · ${U.fmt(offered())} req/s in`; const lbW = ctx.measureText(lbT).width + 28;
      ctx.fillStyle = k.panel; ctx.strokeStyle = k.blue; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(lbX - lbW / 2, lbY - 18, lbW, 36, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = k.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(lbT, lbX, lbY);
      const pos = new Map();
      AZ.forEach((az, i) => {
        const x0 = 20 + i * colW, down = T.azDown.has(az);
        ctx.strokeStyle = down ? k.red : k.line; ctx.setLineDash([5, 4]); ctx.strokeRect(x0 + 6, 70, colW - 12, H - 82); ctx.setLineDash([]);
        ctx.fillStyle = down ? k.red : k.dim; ctx.font = k.monoS; ctx.textAlign = 'left'; ctx.fillText(`AZ ${az}${down ? ' · UNAVAILABLE' : ''}`, x0 + 14, 84);
        const list = T.inst.filter(n => n.az === az); const cw = Math.min(colW - 28, 190), ch = 44; const cols = Math.max(1, Math.floor((colW - 20) / (cw + 8)));
        list.forEach((n, j) => {
          const cx = x0 + 14 + (j % cols) * (cw + 8), cy = 96 + Math.floor(j / cols) * (ch + 8); pos.set(n, [cx + cw / 2, cy]);
          const col = n.state === 'healthy' ? (n.util > 0.98 ? k.red : n.util > 0.8 ? k.amber : k.green) : n.state === 'provisioning' ? k.blue : k.red;
          ctx.fillStyle = U.a(col, 0.12); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 7); ctx.fill(); ctx.stroke();
          ctx.fillStyle = k.fg; ctx.font = k.monoS; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
          const label = n.state === 'healthy' ? `#${n.id}${n.slow ? ' slow' : ''} ${U.fmt(n.util * 100)}% · ${U.fmt(n.lat)} ms` : n.state === 'provisioning' ? `#${n.id} launching ${U.fmt(Math.max(0, n.readyAt - T.t))}s` : `#${n.id} failed${n.detectAt ? ' · still routed' : ''}`;
          ctx.fillText(label, cx + 8, cy + 17);
          const qf = n.state === 'healthy' ? Math.min(1, n.q / (P.cap * (n.slow ? 0.4 : 1) * P.timeoutS)) : 0;
          ctx.fillStyle = k.grid; ctx.fillRect(cx + 8, cy + 26, cw - 16, 8); ctx.fillStyle = qf > 0.9 ? k.red : qf > 0.3 ? k.amber : k.cyan; ctx.fillRect(cx + 8, cy + 26, (cw - 16) * qf, 8);
        });
      });
      if (!U.RM) { dots.forEach(d => { const p = pos.get(d.n); if (!p) return; const x = U.lerp(lbX, p[0], d.u), y = U.lerp(lbY + 18, p[1], d.u); ctx.fillStyle = d.bad ? k.red : k.cyan; ctx.fillRect(x - 2, y - 2, 4, 4); }); }
      ctx.fillStyle = k.dim; ctx.font = k.monoS; ctx.textAlign = 'right'; ctx.fillText('bar = queue depth (full = 2 s timeout)', W - 12, H - 8);
    }
    function drawCharts() {
      if (!T) return; const h = T.hist; const t1 = Math.max(60, T.t), t0 = t1 - 60; const xs = h.map(p => p.t);
      const ymax = Math.max(100, ...h.map(p => p.offered)) * 1.1;
      U.chart(c1, { k, x: [t0, t1], y: [0, ymax], xFmt: v => Math.round(v) + 's', yLabel: 'req/s', legend: true, padL: 46,
        series: [{ xs, data: h.map(p => p.offered), color: k.fg, label: 'offered', width: 1.5, dash: [4, 3] }, { xs, data: h.map(p => p.served), color: k.green, label: 'served' }, { xs, data: h.map(p => p.rejected + p.failed), color: k.red, label: 'rejected/failed' }, { xs, data: h.map(p => p.capTotal), color: k.blue, label: 'capacity', width: 1.2 }] });
      const lmax = Math.max(300, ...h.map(p => p.maxLat)) * 1.1;
      U.chart(c2, { k, x: [t0, t1], y: [0, lmax], xFmt: v => Math.round(v) + 's', yFmt: v => U.fmt(v) + '', yLabel: 'latency ms', legend: true, padL: 50,
        series: [{ xs, data: h.map(p => p.lat), color: k.cyan, label: 'average' }, { xs, data: h.map(p => p.maxLat), color: k.amber, label: 'worst instance', width: 1.4 }] });
    }
    function report(pt) {
      if (!pt) return;
      const healthy = pt.healthy, prov = T.inst.filter(i => i.state === 'provisioning').length;
      U.tiles(el.querySelector('#tiles'), [
        ['Offered', U.fmt(pt.offered) + '/s', ''], ['Served', U.fmt(pt.served) + '/s', pt.served >= pt.offered * 0.99 ? 'good' : 'warn'],
        ['Rejected + failed', U.fmt(pt.rejected + pt.failed) + '/s', pt.rejected + pt.failed > 0.5 ? 'bad' : 'good'], ['Avg latency', U.fmt(pt.lat) + ' ms', pt.lat > 1000 ? 'bad' : pt.lat > 300 ? 'warn' : 'good'],
        ['Utilization', U.fmt(pt.util * 100) + '%', pt.util > 0.95 ? 'bad' : pt.util > 0.8 ? 'warn' : ''], ['Healthy', `${healthy}${prov ? ' +' + prov : ''}`, '', `capacity ${U.fmt(pt.capTotal)}/s`]
      ]);
      let m;
      const bad = pt.rejected + pt.failed;
      if (pt.failed > 0.5) m = `Requests are still being sent to failed instances: the load balancer only stops after health checks fail (${P.hcS} s). Those requests error out.`;
      else if (bad > 0.5 && prov) m = `Offered ${U.fmt(pt.offered)} req/s exceeds capacity ${U.fmt(pt.capTotal)} req/s. ${prov} instance${prov > 1 ? 's are' : ' is'} launching, but they serve nothing until they pass health checks.`;
      else if (bad > 0.5) m = `Offered ${U.fmt(pt.offered)} req/s exceeds capacity ${U.fmt(pt.capTotal)} req/s. Queues hit the ${P.timeoutS} s timeout and ${U.fmt(bad)} req/s are rejected.${P.auto ? '' : ' Turn on autoscaling or add instances.'}`;
      else if (pt.util > 0.85) m = `Running at ${U.fmt(pt.util * 100)}% utilization: no spare capacity to absorb a spike or a failure.`;
      else if (T.azDown.size) m = `An AZ is down, but the remaining ${healthy} instances have enough capacity: users see no errors.`;
      else m = `Healthy: ${U.fmt(pt.served)} req/s served at ${U.fmt(pt.lat)} ms average. Spare capacity ${U.fmt(pt.capTotal - pt.served)} req/s.`;
      el.querySelector('#why').innerHTML = `<h4>What's happening</h4><p>${m}</p>`;

      if (!U.RM) {

        dots.forEach(d => d.u += dt * 1.6); dots = dots.filter(d => d.u < 1 && T.inst.includes(d.n)); if (dots.length > 220) dots.splice(0, dots.length - 220);
      }
    };
    let fr = 0;
    const stop = U.loop(dt => { if (!running) return; tick(dt); drawFleet(); if (fr++ % 3 === 0) { drawCharts(); report(lastPt); } });
    const runEl = el.querySelector('#run');

    U.slider(c, { label: 'Processing time', min: 20, max: 400, step: 10, value: P.procMs, fmt: v => v + ' ms' }, v => { P.procMs = v; T.p.procMs = v; });

    U.seg(c, [['2', '2 AZs'], ['3', '3 AZs']], String(P.azs), v => { P.azs = +v; reset(); }, 'AZs');
    U.seg(c, [['least', 'Least outstanding'], ['rr', 'Round robin']], P.strategy, v => { P.strategy = v; T.p.strategy = v; }, 'Load balancing');
    U.check(c, { label: 'Autoscaling', checked: P.auto }, v => { P.auto = v; T.p.auto = v; });
    const tg = U.slider(c, { label: 'Scale-out target', min: 0.4, max: 0.9, step: 0.05, value: P.target, fmt: v => Math.round(v * 100) + '%' }, v => { P.target = v; T.p.target = v; });
    const dl = U.slider(c, { label: 'Launch delay', min: 5, max: 180, step: 5, value: P.delayS, fmt: v => v + ' s' }, v => { P.delayS = v; T.p.delayS = v; });

scene({
  id: 'iam', section: 'explore', ch: 8, kicker: 'Security and shared responsibility', title: 'How do engineers protect cloud systems?', short: 'IAM policy laboratory', lab: 'Write a policy; see allow, explicit deny and implicit deny.',
  objectives: ['Separate authentication (who) from authorization (what)', 'Write least-privilege policies with actions and resources', 'Apply evaluation: explicit deny > allow > implicit deny'],
  html: `
  <div class="split even">
    <div class="col">
      <div class="controls" id="pre"></div>
      <div id="sts" style="display:grid;gap:8px"></div>
      <div class="controls"><button class="btn" id="add" type="button">Add statement</button></div>
      <details class="explain" open><summary style="cursor:pointer;font-weight:600">Policy JSON</summary><pre class="code" id="json" style="margin-top:8px"></pre></details>
    </div>
    <div class="rail">
      <div class="explain"><h4>The app role "pixelpost-api" makes these calls</h4><p>Only the first four are part of its job.</p></div>
      <div class="tscroll"><table class="t" id="req"></table></div>
      <div class="tiles" id="tiles"></div>
      <div class="explain" id="why" aria-live="polite"></div>
      <div class="engbox eng-only"><b>What this lab models</b><p>Identity-based policies with Action and Resource wildcards. Explicit Deny beats Allow; no matching Allow = implicit deny.</p><p>Not modeled: Conditions, NotAction, resource-based policies (e.g. bucket policies), permission boundaries, SCPs, session policies, cross-account access. This is a learning tool, not a policy validator — use IAM Access Analyzer and the policy simulator for real policies.</p></div>
    </div>
  </div>`,
  notice: 'Green rows the app needs should be allowed; red rows it doesn\'t need should be denied. Anything extra allowed is risk.',
  myth: 'Encryption doesn\'t replace authorization. If a role is allowed to read an encrypted object, the service decrypts it for that role.',
  mount(el) {
    let sts = JSON.parse(JSON.stringify(SIM.iamPresets.admin)); let pick = 'r1';
    const box = el.querySelector('#sts');
    function editor() {
      box.innerHTML = '';
      sts.forEach((s, i) => {
        const c = document.createElement('div'); c.className = 'card'; c.style.padding = '10px 12px';
        c.innerHTML = `<div class="controls" style="justify-content:space-between"><span class="kicker" style="color:var(--dim)">Statement ${i + 1}</span><span class="controls"></span></div><div class="chips act" style="margin-top:6px"></div>`;
        const tools = c.querySelectorAll('.controls')[1];
        U.seg(tools, [['Allow', 'Allow'], ['Deny', 'Deny']], s.Effect, v => { s.Effect = v; eval_(); }, 'Effect');
        U.select(tools, 'Resource', SIM.iamResources.map(r => [r, r.replace('arn:aws:', '').replace(':123456789012', '')]), [].concat(s.Resource)[0], v => { s.Resource = v; eval_(); });
        U.btn(tools, 'Remove', () => { sts.splice(i, 1); editor(); eval_(); });
        const act = c.querySelector('.act');
        SIM.iamActions.forEach(a => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = a; const has = () => [].concat(s.Action).includes(a); b.setAttribute('aria-pressed', String(has()));
          b.onclick = () => { let A = [].concat(s.Action); A = has() ? A.filter(x => x !== a) : A.concat(a); s.Action = A.length === 1 ? A[0] : A; b.setAttribute('aria-pressed', String(has())); eval_(); }; act.appendChild(b); });
        box.appendChild(c);
      });
    }
    const D = { Allow: ['allowed', 'c-green'], ExplicitDeny: ['explicit deny', 'c-red'], ImplicitDeny: ['implicit deny', 'c-amber'] };
    function eval_() {
      el.querySelector('#json').textContent = SIM.iamJson(sts.map(s => ({ Effect: s.Effect, Action: s.Action, Resource: s.Resource })));
      const rs = SIM.iamRequests.map(r => ({ r, e: SIM.iamEval(sts, r.action, r.resource) }));
      el.querySelector('#req').innerHTML = `<thead><tr><th>Call</th><th>Needed</th><th>Result</th></tr></thead><tbody>${rs.map(({ r, e }) => `<tr data-id="${r.id}" style="cursor:pointer${r.id === pick ? ';background:var(--panel2)' : ''}"><td>${r.label}<div class="mono c-dim" style="font-size:11.5px">${r.action}</div></td><td>${r.needed ? '<span class="c-green">yes</span>' : '<span class="c-muted">no</span>'}</td><td class="${D[e.decision][1]}">${D[e.decision][0]}${e.by.length ? ` <span class="c-dim">(stmt ${e.by.map(x => x + 1).join(', ')})</span>` : ''}</td></tr>`).join('')}</tbody>`;
      el.querySelectorAll('#req tr[data-id]').forEach(tr => tr.onclick = () => { pick = tr.dataset.id; eval_(); });
      const need = rs.filter(x => x.r.needed), extra = rs.filter(x => !x.r.needed);
      const okNeed = need.filter(x => x.e.decision === 'Allow').length, okExtra = extra.filter(x => x.e.decision === 'Allow').length;
      U.tiles(el.querySelector('#tiles'), [['Needed calls allowed', `${okNeed}/${need.length}`, okNeed === need.length ? 'good' : 'bad'], ['Unneeded calls allowed', `${okExtra}/${extra.length}`, okExtra ? 'bad' : 'good', okExtra ? 'excess privilege' : 'least privilege']]);
      const p = rs.find(x => x.r.id === pick); const r = p.r, e = p.e;
      const ex = e.decision === 'ExplicitDeny' ? `Statement ${e.by.map(x => x + 1).join(', ')} explicitly denies <code class="k">${r.action}</code>. An explicit deny overrides every allow${e.matches.length > e.by.length ? ', including the matching allow in statement ' + e.matches.filter(m => !e.by.includes(m)).map(x => x + 1).join(', ') : ''}.`
        : e.decision === 'Allow' ? `Statement ${e.by.map(x => x + 1).join(', ')} allows <code class="k">${r.action}</code> on <code class="k">${r.resource}</code>, and no statement denies it.`
        : `No statement allows <code class="k">${r.action}</code> on <code class="k">${r.resource}</code>, so it is denied by default.${r.action === 's3:ListBucket' ? ' Note: ListBucket applies to the bucket ARN (…:::photos-bucket), not to objects (…/photos-bucket/*).' : ''}`;
      el.querySelector('#why').innerHTML = `<h4>${r.label}: ${D[e.decision][0]}</h4><p>${ex}</p>`;
      if (okNeed === need.length && okExtra === 0) U.markDone('iam');
    }
    const pre = el.querySelector('#pre');
    [['admin', 'Admin (*:*)'], ['s3full', 'Service-wide'], ['broken', 'Almost right'], ['least', 'Least privilege'], ['guard', 'Allow + deny guard']].forEach(([k, l]) => U.btn(pre, l, () => { sts = JSON.parse(JSON.stringify(SIM.iamPresets[k])); editor(); eval_(); }));
    el.querySelector('#add').onclick = () => { sts.push({ Effect: 'Allow', Action: 's3:GetObject', Resource: 'arn:aws:s3:::photos-bucket/*' }); editor(); eval_(); };
    editor(); eval_();
  },
  notes: {
    objective: 'Learners write a least-privilege policy and can predict allow / explicit deny / implicit deny.',
    say: ['Authentication proves who you are. Authorization decides what you may do. IAM policies are authorization.', 'Start with Admin: everything works — including deleting orders and reading the billing bucket. That\'s why "it works" isn\'t the goal.', 'Load "Almost right": listing the bucket fails, because ListBucket targets the bucket itself, not the objects inside. Fix it by adding a statement on the bucket ARN.'],
    demo: ['Admin → Almost right (fix it live) → Least privilege → Allow + deny guard (click "Delete a photo" to see the override).'],
    ask: 'Why do teams prefer roles with temporary credentials over access keys stored in code?',
    answer: 'Temporary credentials expire automatically and are never written into code or images, so a leak has a short blast radius and nothing to rotate manually.',
    transition: 'Our app now has code, permissions and infrastructure. How does a change get from a laptop to production safely?'
  },
  check: { q: 'A policy has an Allow for s3:* on a bucket and a Deny for s3:DeleteObject on *. A role calls s3:DeleteObject on that bucket. Result?', opts: ['Allowed — the allow is more specific', 'Denied — explicit deny overrides allow', 'Allowed — later statements win', 'Depends on statement order'], a: 1, why: 'In IAM evaluation an explicit Deny always wins over any Allow; order doesn\'t matter.' }
});

  </div>`,
  notice: 'Each stage is a gate: later stages run only if earlier ones pass. Good pipelines fail early, and production keeps serving the last good version.',
  myth: 'Infrastructure as Code isn\'t just automation: the code is reviewed, versioned and repeatable, so environments don\'t drift apart.',
  mount(el, slide) {

    function draw() {

      ST.forEach((s, i) => { const x = i * (w + gap); const st = state[i]; const col = st === 'ok' ? k.green : st === 'run' ? k.cyan : st === 'fail' ? k.red : st === 'skip' ? k.dim : k.line;
        ctx.fillStyle = U.a(col, st === 'idle' ? 0 : 0.14); ctx.strokeStyle = col; ctx.lineWidth = st === 'run' ? 2.5 : 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, h, 9); ctx.fill(); ctx.stroke();
        ctx.fillStyle = st === 'skip' ? k.dim : k.fg; ctx.font = k.sans; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x + w / 2, y + 24);
        ctx.font = k.monoS; ctx.fillStyle = col === k.line ? k.dim : col; ctx.fillText({ idle: 'waiting', run: 'running…', ok: 'passed', fail: 'FAILED', skip: 'skipped' }[st], x + w / 2, y + 46);
        if (i < n - 1) { ctx.strokeStyle = k.line; ctx.beginPath(); ctx.moveTo(x + w + 1, y + h / 2); ctx.lineTo(x + w + gap - 1, y + h / 2); ctx.stroke(); } });
      ctx.font = k.monoS; ctx.fillStyle = k.dim; ctx.textAlign = 'left'; ctx.fillText('developer → repository → CI → registry → orchestrator (ECS) → load balancer health checks → production', 0, 20);
    }
    const logEl = el.querySelector('#log'); const log = (m, c = '') => { logEl.insertAdjacentHTML('beforeend', `<div class="${c}">${m}</div>`); logEl.scrollTop = 1e9; };
    const traffic = () => {
      el.querySelector('#split').innerHTML = `<div style="flex:${100 - v2};background:color-mix(in srgb,var(--blue) 35%,var(--panel));display:grid;place-items:center;font:600 12px var(--f-mono)">${100 - v2 > 8 ? `v1.9 · ${100 - v2}%` : ''}</div><div style="flex:${v2};background:color-mix(in srgb,var(--green) 40%,var(--panel));display:grid;place-items:center;font:600 12px var(--f-mono)">${v2 > 8 ? `v2.0 · ${v2}%` : ''}</div>`;
      el.querySelector('#fleet').innerHTML = fleet.map((v, i) => `<span class="pill" style="color:${v === 2 ? 'var(--green)' : v === -1 ? 'var(--red)' : 'var(--blue)'}">task ${i + 1}: ${v === 2 ? 'v2.0' : v === -1 ? 'v2.0 crashing' : 'v1.9'}</span>`).join('');
    };
    const wait = ms => new Promise(r => setTimeout(r, U.RM ? 0 : ms));
    async function run() {

      const end = (cls, h, p) => { el.querySelector('#out').innerHTML = `<div class="verdict ${cls}">${h}</div><p style="margin-top:8px;color:var(--muted)">${p}</p>`; busy = false; };

      await stage(3, true, '✓ pushed image pixelpost:2.0 (sha256:9c1e…) to the container registry; scanned for known vulnerabilities');
      state[4] = 'run'; draw();
      const bad = F.config ? 'config' : F.unhealthy ? 'unhealthy' : null;

  notice: 'Every VM carries a whole guest operating system. Containers share the host\'s kernel and package only the app and its dependencies.',

      app: ['Application + libraries', 'Your code and the exact library versions it needs. In a container this is the image; in a VM it is installed onto the guest OS.'],

      for (const [a, b, c] of s.h) { F.edgeOn(a, b); if (anim) await F.packet(a, b, c === 'ret' ? 'pk ret' : (a === 'llm' || b === 'llm' || b === 'emb') ? 'pk ai' : 'pk', 480); }
      s.n.forEach(n => F.state(n, 'on'));
      if (s.stream) await stream(O.rag || O.repeat ? ANS.rag : ANS.plain, anim);
      const si = S.findIndex(x => x.stream); if (si >= 0 && i > si && !ans.textContent) ans.textContent = O.rag || O.repeat ? ANS.rag : ANS.plain;

    say: ['The thing you think of as "the AI" is the purple box. Everything else exists to make it safe, grounded, affordable and observable.', 'Play with RAG on: the answer cites a help article. Turn RAG off: the same model gives a generic answer. Same weights, different context.', 'Turn on "same question again": the cache answers without touching a GPU. Caching is the cheapest inference.'],
    ask: 'Why does a longer prompt make the first token arrive later?',
    answer: 'The model must process every input token (prefill) before generating the first output token.',

  },
  check: { q: 'What does retrieval-augmented generation (RAG) change?', opts: ['The model\'s weights', 'The context supplied with each request', 'The GPU type', 'The tokenizer'], a: 1, why: 'RAG retrieves relevant documents at request time and adds them to the prompt; the model itself is unchanged.' }

scene({
  id: 'gpu', section: 'ai', ai: true, ch: 12, kicker: 'CPU versus GPU', title: 'Why do AI workloads run on GPUs — and when don\'t they need to?', short: 'CPU vs GPU', lab: 'Parallel vs sequential work, transfer overhead and arithmetic intensity.',
  objectives: ['Explain parallelism with few fast cores vs many simpler lanes', 'Account for transfer and launch overhead', 'Recognize workloads that don\'t benefit'],
  html: `
  <div class="split" style="grid-template-columns:minmax(280px,0.8fr) minmax(0,2.2fr)">
    <div class="rail">
      <p class="lede">Each square is one independent task, like multiplying one row of a matrix.</p>
      <div class="controls stack" id="ctl"></div>
      <div class="controls" id="run"></div>
      <div class="tiles" id="tiles"></div>
      <div class="explain" id="why" aria-live="polite"></div>
      <div class="engbox eng-only"><b>Model (abstract ticks, not a benchmark)</b><p>CPU: 8 cores, 1 tick per operation. GPU: 512 lanes, 4 ticks per operation each (simpler, slower lanes), 30-tick kernel launch, data transfer 128 tasks per tick each way. Dependent tasks run one after another on either device.</p><p>Real speedups depend on memory bandwidth, data layout, precision and the libraries used.</p></div>
    </div>
    <div class="col"><div class="viz" style="min-height:380px"><div class="cvhost" id="cv"></div></div></div>
  </div>`,
  notice: 'Large, parallel, compute-heavy jobs favor the GPU. Small jobs lose to transfer overhead; dependent chains can\'t use the lanes at all.',
  myth: 'GPUs aren\'t simply faster processors. They are faster only for work that can be split into many independent pieces and kept on the device.',
  mount(el, slide) {
    const k = U.tok(slide); const P = { n: 4096, opsPerTask: 4, dependent: false }; let R, t = 0, playing = false;
    const c = U.canvas(el.querySelector('#cv'), draw);
    function calc() { R = SIM.parallel(P); t = 0; report(); draw(); }
    function lane(ctx, x, y, w, h, label, total, phases, doneFrac, col) {
      ctx.fillStyle = k.fg; ctx.font = k.sans; ctx.textAlign = 'left'; ctx.fillText(label, x, y - 10);
      let px = x; const max = Math.max(R.cpu, R.gpu);
      phases.forEach(([name, v, pc]) => { const ww = v / max * w; ctx.fillStyle = U.a(pc, 0.18); ctx.fillRect(px, y, ww, h); ctx.strokeStyle = pc; ctx.strokeRect(px, y, ww, h); if (ww > 70) { ctx.fillStyle = k.muted; ctx.font = k.monoS; ctx.fillText(name, px + 6, y + h / 2 + 4); } px += ww; });
      const tx = x + Math.min(t, total) / max * w; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, y - 4); ctx.lineTo(tx, y + h + 4); ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = k.muted; ctx.font = k.monoS; ctx.textAlign = 'right'; ctx.fillText(`${U.fmt(total)} ticks`, x + w, y - 10);
    }
    function grid(ctx, x, y, w, h, frac, lanes, col) {
      const cols = 64, rows = Math.max(1, Math.ceil(Math.min(P.n, 2048) / cols)); const cw = w / cols, ch = Math.min(10, h / rows);
      const shown = Math.min(P.n, 2048), done = Math.floor(shown * frac);
      for (let i = 0; i < shown; i++) { const cx = x + (i % cols) * cw, cy = y + Math.floor(i / cols) * ch; ctx.fillStyle = i < done ? col : k.grid; ctx.fillRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1); }
      ctx.fillStyle = k.dim; ctx.font = k.monoS; ctx.textAlign = 'left'; ctx.fillText(`${U.fmt(P.n)} tasks${P.n > 2048 ? ' (first 2,048 drawn)' : ''} · ${lanes} active lane${lanes > 1 ? 's' : ''}`, x, y + rows * ch + 14);
    }
    function draw() {
      if (!R) return; const { ctx, W, H } = c; ctx.clearRect(0, 0, W, H);
      const x = 24, w = W - 48;
      lane(ctx, x, 40, w, 26, 'CPU · 8 fast cores', R.cpu, [['compute', R.cpu, k.blue]], 0, k.blue);
      lane(ctx, x, 108, w, 26, 'GPU · 512 lanes', R.gpu, [['launch', R.launch, k.dim], ['copy in', R.transfer / 2, k.amber], ['compute', R.gpuCompute, k.violet], ['copy out', R.transfer / 2, k.amber]], 0, k.violet);
      const cpuFrac = Math.min(1, t / R.cpu); const gpuFrac = Math.max(0, Math.min(1, (t - R.launch - R.transfer / 2) / R.gpuCompute));
      const half = (W - 72) / 2;
      ctx.fillStyle = k.fg; ctx.font = k.sans; ctx.textAlign = 'left'; ctx.fillText('CPU progress', x, 176); ctx.fillText('GPU progress', x + half + 24, 176);
      grid(ctx, x, 186, half, H - 220, cpuFrac, P.dependent ? 1 : Math.min(8, P.n), k.blue);
      grid(ctx, x + half + 24, 186, half, H - 220, gpuFrac, P.dependent ? 1 : Math.min(512, P.n), k.violet);
    }
    function report() {
      U.tiles(el.querySelector('#tiles'), [['CPU', U.fmt(R.cpu) + ' ticks', R.winner === 'cpu' ? 'good' : ''], ['GPU', U.fmt(R.gpu) + ' ticks', R.winner === 'gpu' ? 'good' : ''], ['GPU speedup', '×' + U.fmt(R.speedup, R.speedup < 10 ? 2 : 0), R.speedup > 1 ? 'ai' : 'warn'], ['GPU lanes busy', U.fmt(R.gpuUtil * 100) + '%', R.gpuUtil < 0.5 ? 'warn' : '']]);
      let m;
      if (P.dependent) m = 'Each task needs the previous result, so only one lane can work at a time. The GPU\'s slower individual lanes lose to a fast CPU core.';
      else if (R.winner === 'cpu' && R.transfer + R.launch > R.gpuCompute) m = `The job is too small: copying data to the GPU and launching the kernel (${U.fmt(R.transfer + R.launch)} ticks) costs more than the compute it saves.`;
      else if (R.winner === 'cpu') m = 'Not enough work per task to repay the GPU overhead. Raise operations per task or the number of tasks.';
      else m = `Thousands of independent tasks run side by side on 512 lanes. Compute dominates the overhead, so the GPU finishes ${U.fmt(R.speedup, 1)}× sooner. Neural networks are mostly this kind of work: huge matrix multiplications.`;
      el.querySelector('#why').innerHTML = `<h4>Why</h4><p>${m}</p>`;
      if (R.winner === 'gpu' && R.speedup > 5) U.markDone('gpu');
    }
    const ctl = el.querySelector('#ctl');
    const sizes = [16, 64, 256, 1024, 4096, 16384, 65536, 262144];
    U.slider(ctl, { label: 'Number of tasks', min: 0, max: sizes.length - 1, step: 1, value: 4, fmt: v => U.fmt(sizes[v]) }, v => { P.n = sizes[v]; calc(); });
    U.slider(ctl, { label: 'Operations per task', min: 1, max: 32, step: 1, value: P.opsPerTask, fmt: v => v }, v => { P.opsPerTask = v; calc(); });
    U.check(ctl, { label: 'Tasks depend on each other (sequential)', checked: false }, v => { P.dependent = v; calc(); });
    const r = el.querySelector('#run'); let stop = null;
    U.btn(r, 'Race', () => { t = 0; playing = true; if (U.RM) { t = Math.max(R.cpu, R.gpu); draw(); return; } }, 'primary');
    U.btn(r, 'Show result', () => { t = Math.max(R.cpu, R.gpu); draw(); });
    calc();
    stop = U.loop(dt => { if (!playing) return; const max = Math.max(R.cpu, R.gpu); t += dt * max / 3; if (t >= max) { t = max; playing = false; } draw(); });
    return () => { stop(); c.destroy(); };
  },
  notes: {
    objective: 'Learners explain GPU advantage as massive parallelism minus overhead, and identify where it disappears.',
    say: ['Default: 4,096 tasks, 4 operations each. Race: the GPU waits for launch and copy, then sweeps through.', 'Drop to 64 tasks: the CPU wins — the copy costs more than the work.', 'Tick "depend on each other": no parallelism, so one GPU lane versus one CPU core, and the CPU core is faster.'],
    ask: 'Why do LLMs need GPUs for inference but not for, say, a web server?',
    answer: 'Generating each token is dominated by large matrix multiplications over billions of weights — highly parallel. A web request is mostly sequential logic and I/O.',
    transition: 'One GPU serves one model. How do you serve thousands of users?'
  },
  check: { q: 'A tiny job of 64 simple tasks runs slower on the GPU. Why?', opts: ['GPUs can\'t do math', 'Transfer and launch overhead exceed the compute saved', 'The CPU has more lanes', 'GPUs only run neural networks'], a: 1, why: 'Fixed overheads (copying data, launching kernels) dominate when there isn\'t enough parallel work to amortize them.' }
});

scene({
  id: 'inference', section: 'ai', ai: true, ch: 12, kicker: 'AI inference scaling', title: 'How do you serve a model to thousands of users?', short: 'Inference scaling lab', lab: 'Memory, batching, replicas, queueing, latency and cost per token.',
  objectives: ['Size GPU memory for weights and KV cache', 'Trade batch size and replicas against latency and cost', 'Explain why more GPUs give sublinear speedups'],
  html: `
  <div class="split" style="grid-template-columns:minmax(290px,0.85fr) minmax(0,2.1fr)">
    <div class="rail" style="gap:10px">
      <div class="controls stack" id="ctl"></div>
      <div class="engbox eng-only"><b>Model</b><p>Weights = params × 2 bytes (FP16). KV cache per token = 2 × layers × KV width × 2 bytes. Batch ≤ free memory ÷ KV per request. Decode step = (base + per-sequence × batch) ÷ tensor-parallel speedup, speedup = g ÷ (1 + 0.12(g−1)). A request occupies one batch slot for prefill + output × step. Waiting from M/M/c (Erlang C) with c = replicas × batch.</p><p>All rates are illustrative assumptions; real engines (continuous batching, paged KV, quantization) behave differently. Measure your own workload.</p></div>
    </div>
    <div class="col">
      <div class="tiles" id="tiles"></div>
      <div class="grid2" style="align-items:stretch">
        <div class="explain"><h4>One replica's memory</h4><div id="mem"></div></div>
        <div class="explain" id="why" aria-live="polite"></div>
      </div>
      <div class="grid2"><div class="viz" style="min-height:210px"><div class="cvhost" id="c1"></div></div><div class="viz" style="min-height:210px"><div class="cvhost" id="c2"></div></div></div>
      <div class="explain eng-only"><h4>Training vs inference</h4><p>Training runs forward and backward passes over a dataset for hours to weeks, keeping gradients and optimizer state in memory (several times the weights) and synchronizing GPUs constantly. Inference only runs forward passes, must answer within seconds, and is sized for request traffic. Different hardware choices and cost profiles follow.</p></div>
    </div>
  </div>`,
  notice: 'Latency stays flat until utilization approaches 100%, then rises steeply. Replicas push that wall to the right — and add cost linearly.',
  myth: 'More GPUs don\'t guarantee proportionally faster AI. Communication between GPUs, memory limits and queueing all eat into the gain.',
  mount(el, slide) {
    const k = U.tok(slide); const P = Object.assign({}, SIM.llmDefaults);
    const c1 = U.canvas(el.querySelector('#c1'), draw), c2 = U.canvas(el.querySelector('#c2'), draw); let R;
    function upd() { R = SIM.llmPlan(P); report(); draw(); }
    function report() {
      const lat = R.stable ? U.fmt(R.latency, 1) + ' s' : 'overloaded';
      U.tiles(el.querySelector('#tiles'), [
        ['Fits in memory', R.fits ? 'yes' : 'no', R.fits ? 'good' : 'bad', R.fits ? `batch ≤ ${R.memBatch} by memory` : 'add GPUs per replica'],
        ['Effective batch', R.batch, R.batch < P.batch ? 'warn' : '', R.batch < P.batch ? 'memory-limited' : 'as configured'],
        ['Capacity', U.fmt(R.capRps, 1) + ' req/s', R.capRps > P.rps ? 'good' : 'bad', `${R.slots} concurrent slots`],
        ['Utilization', R.fits ? U.fmt(Math.min(R.rho, 9.99) * 100) + '%' : '—', R.rho >= 1 ? 'bad' : R.rho > 0.8 ? 'warn' : ''],
        ['Time to first token', R.stable ? U.fmt(R.ttft, 2) + ' s' : '∞', R.stable && R.ttft < 1 ? 'good' : 'warn'],
        ['End-to-end latency', lat, R.stable ? (R.waitS > 1 ? 'warn' : '') : 'bad', R.stable ? `queue wait ${U.fmt(R.waitS, 2)} s` : 'queue grows without bound'],
        ['Per-user speed', U.fmt(R.perStreamTokS) + ' tok/s', 'ai'],
        ['Cost', U.money(R.costHr) + '/hr', '', R.stable && R.tokPerSec > 0 ? `${U.money(R.costPerMTok)} per 1M output tokens` : '']
      ]);
      const mem = R.memGB, seg = (v, c, l) => v > 0 ? `<span title="${l}" style="width:${Math.min(100, v / mem * 100)}%;background:${c}"></span>` : '';
      el.querySelector('#mem').innerHTML = `<div style="display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--grid);margin-top:4px">${seg(R.weightsGB, 'var(--violet)', 'weights')}${seg(R.reserveGB, 'var(--dim)', 'runtime')}${seg(Math.max(0, R.kvUsedGB), 'var(--cyan)', 'KV cache')}</div>
        <p style="margin-top:6px;font-size:13.5px">${P.gpus} × ${P.gpuMemGB} GB = ${mem} GB · weights <b>${U.fmt(R.weightsGB)} GB</b> · runtime ${U.fmt(R.reserveGB)} GB · KV cache ${U.fmt(R.kvPerSeqGB * 1000, 0)} MB per request × ${R.batch} = <b>${U.fmt(R.kvUsedGB, 1)} GB</b>${R.weightsGB > mem ? ' · <span class="c-red">weights alone exceed memory</span>' : ''}</p>`;
      let m;
      if (!R.fits) m = `The ${R.m.label} model needs ${U.fmt(R.weightsGB)} GB for weights alone (plus KV cache), more than ${mem} GB. Split it across more GPUs per replica (tensor parallelism) or use a smaller / quantized model.`;
      else if (!R.stable) m = `Demand (${P.rps} req/s) exceeds capacity (${U.fmt(R.capRps, 1)} req/s). The queue grows without limit. Add replicas, raise the batch size, or shorten outputs. A new replica takes about ${P.loadS} s to load the model, so ~${U.fmt(R.backlog)} requests would pile up meanwhile.`;
      else if (R.rho > 0.85) m = `At ${U.fmt(R.rho * 100)}% utilization a small traffic increase causes large waits. This is the "knee" of the latency curve.`;
      else if (R.rho < 0.3) m = `Only ${U.fmt(R.rho * 100)}% utilized: latency is good but you're paying for idle GPUs (${U.money(R.costHr)}/hr).`;
      else m = `Healthy: ${U.fmt(R.rho * 100)}% utilized with ${U.fmt(R.waitS, 2)} s average queueing.`;
      if (P.gpus > 1 && R.fits) m += ` With ${P.gpus} GPUs per replica, compute speeds up only ×${U.fmt(R.sp, 2)} because GPUs must exchange activations every layer.`;
      el.querySelector('#why').innerHTML = `<h4>What the numbers say</h4><p>${m}</p>`;
      if (R.stable && R.rho > 0.4 && R.rho < 0.85) U.markDone('inference');
    }
    function draw() {
      if (!R) return;
      const xs = [], lat = [], maxR = Math.max(1, R.capRps * 1.3, P.rps * 1.2);
      for (let i = 0; i <= 60; i++) { const r = maxR * i / 60; const q = SIM.llmPlan(Object.assign({}, P, { rps: r })); xs.push(r); lat.push(q.stable ? q.latency : NaN); }
      const finite = lat.filter(v => isFinite(v)); const ymax = Math.max(1, ...finite.slice(0, -1)) * 1.1 || 10;
      U.chart(c1, { k, x: [0, maxR], y: [0, Math.min(ymax, (R.serviceS || 1) * 6)], xFmt: v => U.fmt(v, 1), yFmt: v => U.fmt(v, 0) + 's', xLabel: 'req/s', yLabel: 'end-to-end latency', padL: 44,
        series: [{ xs, data: lat.map(v => isFinite(v) ? v : 1e9), color: k.violet }], hlines: [], points: [{ x: P.rps, y: R.stable ? R.latency : 1e9, color: R.stable ? k.cyan : k.red, label: 'you' }],
        bands: [{ from: Math.min(R.capRps, maxR), to: maxR, color: U.a(k.red, 0.08) }] });
      const g = [1, 2, 4, 8]; const sp = g.map(x => SIM.tpSpeedup(x, P.comm));
      U.chart(c2, { k, x: [1, 8], y: [0, 8], xTicks: 7, xFmt: v => Math.round(v) + ' GPU', yFmt: v => '×' + U.fmt(v), yLabel: 'compute speedup per replica', legend: true, padL: 40,
        series: [{ xs: g, data: g, color: k.dim, dash: [4, 4], label: 'ideal' }, { xs: g, data: sp, color: k.violet, label: 'with communication', dot: true }], points: [{ x: P.gpus, y: SIM.tpSpeedup(P.gpus, P.comm), color: k.cyan }] });
    }
    const c = el.querySelector('#ctl');
    U.seg(c, [['8b', '8B model'], ['70b', '70B model']], P.model, v => { P.model = v; upd(); }, 'Model');
    U.slider(c, { label: 'Requests per second', min: 0.5, max: 60, step: 0.5, value: P.rps, fmt: v => v }, v => { P.rps = v; upd(); });
    U.slider(c, { label: 'Input tokens (avg)', min: 100, max: 8000, step: 100, value: P.inTok, fmt: v => U.fmt(v) }, v => { P.inTok = v; upd(); });
    U.slider(c, { label: 'Output tokens (avg)', min: 20, max: 2000, step: 20, value: P.outTok, fmt: v => U.fmt(v) }, v => { P.outTok = v; upd(); });
    U.slider(c, { label: 'Max batch size', min: 1, max: 64, step: 1, value: P.batch, fmt: v => v }, v => { P.batch = v; upd(); });
    U.slider(c, { label: 'Replicas', min: 1, max: 16, step: 1, value: P.replicas, fmt: v => v }, v => { P.replicas = v; upd(); });
    U.seg(c, [['1', '1 GPU'], ['2', '2'], ['4', '4'], ['8', '8']], String(P.gpus), v => { P.gpus = +v; upd(); }, 'GPUs per replica');
    const e1 = U.slider(c, { label: '$ per GPU-hour', min: 0.5, max: 12, step: 0.5, value: P.gpuHour, fmt: v => '$' + v }, v => { P.gpuHour = v; upd(); });
    const e2 = U.slider(c, { label: 'Model load time', min: 30, max: 900, step: 30, value: P.loadS, fmt: v => v + ' s' }, v => { P.loadS = v; upd(); });
    [e1, e2].forEach(s => s.el.classList.add('eng-only'));
    upd();
    return () => { c1.destroy(); c2.destroy(); };
  },
  notes: {
    objective: 'Learners reason about inference capacity from memory, batching, replicas and queueing, and connect it to cost.',
    say: ['8B model on one 80 GB GPU: weights take 16 GB, the rest holds KV cache — each request\'s attention memory.', 'Push requests per second: latency stays flat, then climbs a wall near 100% utilization. Add a replica: the wall moves right; the hourly cost doubles.', 'Switch to 70B: it doesn\'t fit. Two GPUs: it fits, but with barely room for 8 requests. Four GPUs: plenty of room — but only about 3× faster, not 4×.'],
    ask: 'Your bill doubled when you added a replica, but average latency barely changed. Was it a mistake?',

    transition: 'Serving is the end of the story. Where do models come from?'
  },
  check: { q: 'A 70B-parameter model at 2 bytes per parameter needs about how much memory just for weights?', opts: ['14 GB', '70 GB', '140 GB', '700 GB'], a: 2, why: '70 × 10⁹ parameters × 2 bytes = 140 × 10⁹ bytes ≈ 140 GB, before any KV cache.' }
});
